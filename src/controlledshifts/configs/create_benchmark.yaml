# @package _global_
defaults:
  - benchmark: causal_agents  # override via benchmark=ego_safeshift or benchmark=safeshift
  - scenario: waymo
  - visualization: viz_static
  - dataset: waymo_analysis
  - scoring: ego_safeshift  # ego_safeshift reads cfg.scoring to score scenarios when no score CSV is provided
  - _self_

# General parameters shared across all benchmarks.
seed: 42
num_workers: 20

# Directory where each benchmark's split is saved as ${splits_path}/${benchmark_name}.json.
splits_path: /data/driving/waymo/splits

# If false, reuse work that already exists: an existing split JSON is loaded instead of recomputed and prepared
# perturbed variant stores are left in place. Set true to regenerate everything.
overwrite: false

task_name: create_benchmark
