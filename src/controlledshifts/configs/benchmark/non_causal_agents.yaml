# @package _global_

benchmark_name: non_causal_agents

# Path to the directory containing per-scenario JSON causal labels (used for non-causal counts and on-the-fly
# generation of the perturbed copies).
causal_labels_path: /data/driving/waymo/causal_agents/processed_labels/

# Path to an existing remove_noncausal perturbed output to reuse. Scenarios missing from this directory are generated
# on the fly. If the directory does not exist, all perturbed copies are generated.
perturbed_data_path: /data/driving/waymo/processed/remove_noncausal/

# (train, val, test) fractions of the full dataset. Scenarios with the most non-causal agents form the test set.
# Should sum to 1.0.
split_ratios: [0.70, 0.15, 0.15]
