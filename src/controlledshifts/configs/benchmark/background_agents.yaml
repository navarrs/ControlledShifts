# @package _global_
defaults:
  - default.yaml

# On-disk split-file stem (splits/background_agents.json).
benchmark_name: background_agents

# Benchmark whose saved split (${splits_path}/<reference_benchmark>.json) this benchmark reuses, so perturbed scenes
# land in the same train/validation/testing buckets as their unperturbed counterparts. That benchmark must be created
# first; its split directories also serve the unperturbed "original" data, which is not re-copied here.
reference_benchmark: uniform

# Root for the flat perturbed variant stores. The preparation step writes each strategy's perturbed scenes flat to
# output_data_path/<strategy>/ (e.g. /data/driving/waymo/variants/remove_noncausal, reused by the
# background_agents_hard benchmark). Build the agent-centric cache per variant afterwards via
# controlledshifts.build_ac_cache.
output_data_path: /data/driving/waymo/variants

# Path to the directory containing per-scenario JSON causal labels.
causal_labels_path: /data/driving/waymo/meta/causal_agents/processed_labels/

# If true, generate the flat perturbed dataset for every masking strategy (remove_causal, remove_noncausal,
# remove_noncausalequal, remove_static) up front under output_data_path/<strategy>/.
prepare_perturbations: true
