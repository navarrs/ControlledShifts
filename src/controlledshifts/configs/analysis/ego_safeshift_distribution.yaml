# @package _global_
defaults:
  - default.yaml

analysis_name: ego_safeshift_distribution
output_path: ./outputs/ego_safeshift_distribution_analysis

# Unlike the model-results analyses this reads the ego-safeshift scores CSV (columns: scenario_ids + score columns) and
# reproduces each benchmark's split in-script, so it needs neither scenario pkls nor a pre-existing split JSON.
scores_csv_path: /data/driving/waymo/meta/ego_safeshift/scores/scene_to_scores_mapping.csv

# Column used to rank scenarios when reproducing the ego_safeshift split (higher score = harder = test set).
score_type: gt_critical_continuous_safeshift
split_ratios: [0.70, 0.15, 0.15]

# When false (default), plots are regenerated from the cached ego_safeshift_distribution.csv without re-reading the CSV.
# Set
# true to recompute the frame -- also required to pick up changes to `benchmarks` against an already-cached CSV.
overwrite: false

# Score columns to plot, each as its own side-by-side violin, histogram and ridgeline figure. Split colors are fixed in
# SPLIT_COLOR_MAP (controlledshifts.utils.analysis.common), not a palette.
quantities:
  - gt_critical_continuous_individual
  - gt_critical_continuous_interaction
  - gt_critical_continuous_safeshift

# Each benchmark is one panel. `split: score` ranks by score_type (hardest to test); `split: random` splits uniformly.
benchmarks:
  - uniform:
      name: Uniform
      split: random
  - ego_safeshift:
      name: EgoSafeShift
      split: score
