defaults:
  - default.yaml

tag: 'causal-agents-all'

# Training and validation use the unmodified scenes (uniform split reused by the causal_agents benchmark).
train_sources:
  - {variant: base, split_json: uniform, split: training, tag: uniform-training}

val_sources:
  - {variant: base, split_json: uniform, split: validation, tag: uniform-validation}

# Testing uses the unmodified scenes and their perturbed counterparts for every masking strategy (same IDs, different
# variant cache).
test_sources:
  - {variant: base, split_json: uniform, split: validation, tag: uniform-validation}
  - {variant: base, split_json: uniform, split: testing, tag: uniform-testing}
  - {variant: remove_causal, split_json: uniform, split: validation, tag: remove-causal-validation}
  - {variant: remove_causal, split_json: uniform, split: testing, tag: remove-causal-testing}
  - {variant: remove_noncausal, split_json: uniform, split: validation, tag: remove-noncausal-validation}
  - {variant: remove_noncausal, split_json: uniform, split: testing, tag: remove-noncausal-testing}
  - {variant: remove_noncausalequal, split_json: uniform, split: validation, tag: remove-noncausalequal-validation}
  - {variant: remove_noncausalequal, split_json: uniform, split: testing, tag: remove-noncausalequal-testing}
  - {variant: remove_static, split_json: uniform, split: validation, tag: remove-static-validation}
  - {variant: remove_static, split_json: uniform, split: testing, tag: remove-static-testing}
