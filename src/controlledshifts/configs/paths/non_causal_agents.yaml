defaults:
  - default.yaml

tag: 'non-causal-agents'

# NOTE: scenarios are re-split into training/validation/testing by the number of non-causal agents (hardest scenarios
# go to testing). Both an unperturbed `original` copy and a `perturbed` (remove_noncausal) copy are stored per split.

# NOTE: for training and validation, this uses the reorganized original (unmodified) scenarios.
train_data_path: [ "${paths.base_path}/processed/non_causal_agents/original/training" ] # list of paths to the training data
train_data_tag: ["non-causal-original-training"]
val_data_path: ["${paths.base_path}/processed/non_causal_agents/original/validation" ] # list of paths to the validation data
val_data_tag: ["non-causal-original-validation"]

# NOTE: for testing, we evaluate the original and the perturbed (remove_noncausal) versions of the same held-out scenes.
test_data_path: [
  "${paths.base_path}/processed/non_causal_agents/original/validation",
  "${paths.base_path}/processed/non_causal_agents/original/testing",
  "${paths.base_path}/processed/non_causal_agents/perturbed/validation",
  "${paths.base_path}/processed/non_causal_agents/perturbed/testing",
]
test_data_tag: [
  "non-causal-original-validation",
  "non-causal-original-testing",
  "non-causal-perturbed-validation",  # Perturbation: removes agents that are NOT causal to the ego.
  "non-causal-perturbed-testing",
]
