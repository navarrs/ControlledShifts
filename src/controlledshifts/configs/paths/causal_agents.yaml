defaults:
  - default.yaml

tag: 'causal-agents'

# NOTE: training and validation use the unmodified scenes, served from the reused uniform split directories.
train_data_path: [ "${paths.base_path}/processed/uniform/training" ] # list of paths to the training data
train_data_tag: ["uniform-training"]
val_data_path: ["${paths.base_path}/processed/uniform/validation" ] # list of paths to the validation data
val_data_tag: ["uniform-validation"]

# NOTE: testing uses the unmodified scenes (from uniform) and their perturbed (remove_noncausal) counterparts.
test_data_path: [
  "${paths.base_path}/processed/uniform/validation",
  "${paths.base_path}/processed/uniform/testing",
  "${paths.base_path}/processed/causal_agents/remove_noncausal/validation",
  "${paths.base_path}/processed/causal_agents/remove_noncausal/testing",
]
test_data_tag: [
  "uniform-validation",
  "uniform-testing",
  "remove-noncausal-validation",      # Perturbation: removes agents that are NOT causal to the ego.
  "remove-noncausal-testing",
]
