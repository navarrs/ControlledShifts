defaults:
  - default.yaml

tag: 'environments'

# Re-splits the base scenes by road-topology cluster hardness (hardest clusters go to testing); the partition lives in
# splits/environments.json.
train_sources:
  - {variant: base, split_json: environments, split: training, tag: environments-training}

val_sources:
  - {variant: base, split_json: environments, split: validation, tag: environments-id}

test_sources:
  - {variant: base, split_json: environments, split: validation, tag: environments-id}
  - {variant: base, split_json: environments, split: testing, tag: environments-ood}
