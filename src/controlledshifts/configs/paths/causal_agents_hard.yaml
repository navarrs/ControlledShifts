defaults:
  - default.yaml

tag: 'causal-agents-hard'

# Scenarios are re-split into training/validation/testing by the number of non-causal agents (hardest go to testing);
# the partition lives in splits/causal_agents_hard.json. Training/validation use the unmodified (base) scenes.
train_sources:
  - {variant: base, split_json: causal_agents_hard, split: training, tag: causal-agents-hard-original-training}

val_sources:
  - {variant: base, split_json: causal_agents_hard, split: validation, tag: causal-agents-hard-original-validation}

# Testing evaluates the original and perturbed (remove_noncausal) versions of the same held-out scenes.
test_sources:
  - {variant: base, split_json: causal_agents_hard, split: validation, tag: causal-agents-hard-original-validation}
  - {variant: remove_noncausal, split_json: causal_agents_hard, split: testing, tag: remove-noncausal-hard-testing}
