defaults:
  - default.yaml

tag: 'uniform'

# Each source = {variant, split_json, split, tag}. The split JSON (splits/uniform.json) selects scenario IDs; the
# variant's agent-centric cache supplies the records; the tag labels the source for per-source metrics.
train_sources:
  - {variant: base, split_json: uniform, split: training, tag: uniform-training}

val_sources:
  - {variant: base, split_json: uniform, split: validation, tag: uniform-validation}

test_sources:
  - {variant: base, split_json: uniform, split: validation, tag: uniform-validation}
  - {variant: base, split_json: uniform, split: testing, tag: uniform-testing}
