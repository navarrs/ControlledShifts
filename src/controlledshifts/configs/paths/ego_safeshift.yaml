defaults:
  - default.yaml

# Re-splits the base scenes by Ego-SafeShift's per-scenario 'gt' scores (hardest go to testing). create_benchmark writes
# one split file per scoring variant, named by the run's `split_name` (e.g. ego_safeshift_scores8) or an auto-derived
# ego_safeshift_<tag>. Point `split_json` below at the file you created (the create_benchmark run logs its exact path).
# For the simple single-CSV case, pass `split_name=ego_safeshift` so the partition lives in splits/ego_safeshift.json,
# matching the default below.
tag: 'ego-safeshift'

# Training and validation use the In-Distribution (ID) subset.
train_sources:
  - {variant: base, split_json: ego_safeshift, split: training, tag: ego-safeshift-training}

val_sources:
  - {variant: base, split_json: ego_safeshift, split: validation, tag: ego-safeshift-validation}

# Testing reports ID (validation) and OOD (testing) subsets.
test_sources:
  - {variant: base, split_json: ego_safeshift, split: validation, tag: ego-safeshift-id}
  - {variant: base, split_json: ego_safeshift, split: testing, tag: ego-safeshift-ood}
