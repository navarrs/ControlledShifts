defaults:
  - default.yaml

# Re-splits the base scenes by Ego-SafeShift's per-scenario 'gt' scores (hardest go to testing); the partition lives in
# splits/ego_safeshift.json.
tag: 'ego-safeshift'

# Training and validation use the In-Distribution (ID) subset.
train_sources:
  - {variant: base, split_json: ego_safeshift, split: training, tag: ego-safeshift-training}

val_sources:
  - {variant: base, split_json: ego_safeshift, split: validation, tag: ego-safeshift-validation}

# Testing reports ID (validation) and OOD (testing) subsets.
test_sources:
  - {variant: base, split_json: ego_safeshift, split: validation, tag: ego-safeshift-id}
  - {variant: base, split_json: ego_safeshift, split: testing, tag: ego-safeshift-ood}
