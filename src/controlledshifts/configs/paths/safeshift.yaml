defaults:
  - default.yaml

# TODO: Revise this config. Combines the SafeShift and CausalAgents benchmarks. The legacy copy-based layout mixed
# several processed sets (mini_causal, safeshift_causal); under the canonical layout all unperturbed sources are the
# base variant re-split by splits/safeshift.json, and the perturbed source reads the remove_noncausal variant.
tag: 'safeshift'

# Training and validation use the original (unmodified) base scenes under the SafeShift split.
train_sources:
  - {variant: base, split_json: safeshift, split: training, tag: safeshift-training}

val_sources:
  - {variant: base, split_json: safeshift, split: validation, tag: safeshift-id}

# Testing combines the SafeShift OOD scenes with their perturbed (remove_noncausal) counterparts.
test_sources:
  - {variant: base, split_json: safeshift, split: testing, tag: safeshift-ood}
  - {variant: remove_noncausal, split_json: safeshift, split: validation, tag: remove-noncausal-validation}
  - {variant: remove_noncausal, split_json: safeshift, split: testing, tag: remove-noncausal-testing}
