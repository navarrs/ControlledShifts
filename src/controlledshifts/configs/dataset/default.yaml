defaults:
  # Single source of truth for the SafeShift scoring params; mounted under `config` so the autolabel pipeline and the
  # cache-profile hash see them. `_self_` is last so the explicit `config:` keys below still merge.
  - /scoring/ego_safeshift@config
  - _self_

_target_: controlledshifts.datasets.base_dataset.BaseDataset
config:
  load_data: true
  split: null
  num_data_to_consider: null
  # Seed for the (DDP-deterministic) sample shuffle and the train-only subsample.
  seed: ${seed}

  past_len: ${scenario.past_len}
  future_len: ${scenario.future_len}

  # Canonical agent-centric cache + benchmark split roots. The input is always the same cache; only the per-source
  # split definition (which split JSON, which variant) changes between benchmarks.
  ac_cache_root: ${paths.ac_cache_path}
  splits_root: ${paths.splits_path}
  # Cosmetic label stored in the cache index/profile files; the cache identity is the processing-profile hash.
  profile_alias: ${oc.select:model.config.model_name,unknown}

  # Each source = {variant, split_json, split, tag}. The split JSON selects scenario IDs; the variant's cache supplies
  # the agent-centric records; the tag labels the source (reported per-source via dataset_name).
  train_sources: ${paths.train_sources}
  val_sources: ${paths.val_sources}
  test_sources: ${paths.test_sources}

  store_data_in_memory: false

  masked_attributes: ['z_axis', 'size']
  object_type: ['TYPE_VEHICLE', 'TYPE_PEDESTRIAN', 'TYPE_CYCLIST']
  line_type: [ 'lane','stop_sign','road_edge','road_line','crosswalk','speed_bump' ]

  only_train_on_ego: true
  trajectory_sample_interval: 1
  max_num_agents: ${model.config.max_num_agents}
  max_num_roads: ${model.config.max_num_roads}
  max_points_per_lane: ${model.config.max_points_per_lane}
  map_range: ${model.config.map_range}
  manually_split_lane: ${model.config.manually_split_lane}
  point_sampled_interval: ${model.config.point_sampled_interval}
  num_points_each_polyline: ${model.config.num_points_each_polyline}
  vector_break_dist_thresh: ${model.config.vector_break_dist_thresh}
  total_map_types: 20 # NOTE: not sure where the value is coming from
  center_offset_of_map: ${model.config.center_offset_of_map}

  causal_labels_path: ${paths.causal_labels_path}

  # SafeShift configuration. The scoring params (conflict_points / closest_lanes / scenario_characterization) are
  # composed from the shared `scoring/ego_safeshift` group via this file's `defaults`; see
  # configs/scoring/ego_safeshift.yaml.
  autolabel_agents: ${autolabel_agents}
