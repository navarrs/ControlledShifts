defaults:
  - default.yaml

# Analysis/visualization use this config to build an AgentCentricProcessor (Scenario -> records) rather than a torch
# Dataset; _target_ is inherited (BaseDataset) and only matters if something instantiates it with load_data: false.
config:
  load_data: false
  autolabel_agents: false
  causal_labels_path: /data/driving/waymo/meta/causal_agents/processed_labels/

  # Override all interpolated fields from default.yaml so this config is usable outside the full training config tree.
  past_len: 11
  future_len: 80
  seed: 0
  ac_cache_root: null
  splits_root: null
  profile_alias: unknown
  train_sources: null
  val_sources: null
  test_sources: null
  max_num_agents: null
  max_num_roads: null
  max_points_per_lane: null
  map_range: null
  manually_split_lane: null
  point_sampled_interval: null
  num_points_each_polyline: null
  vector_break_dist_thresh: null
  center_offset_of_map: null
  only_train_on_ego: true
