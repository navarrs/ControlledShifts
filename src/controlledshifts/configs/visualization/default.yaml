
# viz_type drives the per-type data prep. render (static/animated) is derived from the visualizer's is_animated
# property; pane_type is derived from viz_type unless explicitly overridden (see viz_causal).
viz_type: null         # regular | scored | trajpred | model_output

visualizer:
  _target_: null
  config:
    scenario_type: gt
    is_ego_centric: false

    panes_to_plot:
      - ALL_AGENTS
      - HIGHLIGHT_RELEVANT

    static_map_keys:
      - lane
      - crosswalk
      - speed_bump
      - road_edge
      - road_line
      - stop_sign

    dynamic_map_keys:
      - stop_point

    map_colors:
      lane: "k"
      crosswalk: "cyan"
      speed_bump: "orange"
      road_edge: "k"
      road_line: "k"
      stop_sign: "red"
      stop_point: "purple"

    map_alphas:
      lane: 0.1
      crosswalk: 0.6
      speed_bump: 0.6
      road_edge: 0.1
      road_line: 0.1
      stop_sign: 0.8
      stop_point: 0.8

    agent_colors:
      TYPE_PEDESTRIAN: "plum"
      TYPE_CYCLIST: "forestgreen"
      TYPE_VEHICLE: "slategray"
      TYPE_SDC: "dodgerblue"
      TYPE_RELEVANT: "coral"
      TYPE_RELEVAN: "coral"
