# @package _global_
defaults:
  - train.yaml
  - _self_

# Sample selection
create_training_batch_cache: false # if 'true' it will create a batch cache for the train data using the pretrained model.
model:
  config:
    sample_selection: true

selection_strategies:
  # - random_drop
  - kmeans_random_drop
  - simple_kmeans_cosine_drop
  - gumbel_kmeans_cosine_drop
  - vocab_cluster_hamming_drop
  - vocab_cluster_jaccard_drop
  - den_tp
selection_strategy: null
percentages_to_keep:
  - 0.45
  - 0.55
  - 0.65
  - 0.75
  - 0.85
  - 0.95
percentage_to_keep: null # percentage threshold to determine if dropping elements
sorting_strategy: 'simple'
alignment_strategy: 'jaccard' # alignment metric to use 'jaccard' or 'hamming'
min_percentage_per_class: 0.012 # percentage threshold to determine if dropping elements of a class

# K-Means specific parameters
clustering_strategy: 'kmeans' # clustering strategy to use for sample selection, currently only supports 'kmeans'
num_clusters: 100 # number of clusters to use for k-means strategy

# DenTP specific parameters
agent_density_interval: 4 # agent interval to separate scenarios into different bins
agent_density_weight: 1.0  # removal weight w_k = k^agent_density_weight / (|D| - |D_k|)

# General Parameters
task_name: 'sample_selection' # Reference task name
palette: gist_ncar # Color palette used for visualizations
num_batches: null # Number of batches to load for the analysis experiment. If 'null', it loads all batches.
num_scenarios: null # Number of scenarios to consider for analysis experiment. If 'null', it loads all scenarios
select_mode: true # If 'true' selects the best predicted mode for visualization
seed: 42 # Seed for random generators

split: train # Specify split to consider 'train', 'val' or 'test'
scenarios_path: ${paths.base_path}/processed/mini_causal/training # Specify path to input scenarios


# Specify name of experiment to consider
paths:
  # -----------------------------------------------------------
  # Experiment paths for best models on Causal Agents Benchmark
  # -----------------------------------------------------------

  # Wayformer (ckpt: epoch_093.ckpt) -- used for K-Means selection strategy and DenTP selection strategy
  # uv run -m controlledshifts.sample_selection model=wayformer ckpt_path=/data/driving/waymo/causal-benchmark-labeled/model_cache/causal-benchmark-labeled_wayformer_2026-02-19_01-23-56/ckpts/causal-benchmark-labeled_wayformer/epoch_093.ckpt
  # experiment_dir: causal-benchmark-labeled_wayformer_2026-02-19_01-23-56

  # -----------------------------------------------------------
  # Experiment paths for best models on Ego SafeShift Benchmark
  # -----------------------------------------------------------

  # Wayformer (ckpt: epoch_138.ckpt)
  # uv run -m controlledshifts.run_sample_selection paths=ego_safeshift_causal model=wayformer ckpt_path=/data/driving/waymo/ego-safeshift-causal-benchmark/model_cache/ego-safeshift-causal-benchmark_wayformer_2026-02-20_04-45-11/ckpts/ego-safeshift-causal-benchmark_wayformer/epoch_138.ckpt
  experiment_dir: ego-safeshift-causal-benchmark_wayformer_2026-02-20_04-45-11

  # -----------------------------------------------------------
  # Experiment paths for best models on Environments Benchmark
  # -----------------------------------------------------------

  # Wayformer (ckpt: epoch_087.ckpt)
  # uv run -m controlledshifts.run_sample_selection paths=environments model=wayformer ckpt_path=/data/driving/waymo/environments-benchmark/model_cache/environments-benchmark_wayformer_2026-04-14_10-27-47/ckpts/environments-benchmark_wayformer/epoch_087.ckpt
  # experiment_dir: environments-benchmark_wayformer_2026-04-14_10-27-47
