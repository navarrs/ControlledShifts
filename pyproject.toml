[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlledshifts"
version = "0.1.0"
description = "ControlledShifts package"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Ingrid Navarro" }
]

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
]

[tool.hatch.build.targets.wheel]
include = ["src/**"]
packages = ["src/controlledshifts"]

[tool.hatch.build.sources]
src = "src"

[tool.uv]
package = true
